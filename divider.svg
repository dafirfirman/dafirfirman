<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 24" width="1000" height="24" role="presentation">
  <defs>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00F0FF" stop-opacity="0"/>
      <stop offset="0.25" stop-color="#00F0FF"/>
      <stop offset="0.5" stop-color="#7C5CFF"/>
      <stop offset="0.75" stop-color="#FF4FD8"/>
      <stop offset="1" stop-color="#FF4FD8" stop-opacity="0"/>
    </linearGradient>
    <filter id="g" x="-50%" y="-300%" width="200%" height="700%">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <style>
    .dot { animation: slide 4s ease-in-out infinite alternate; }
    @keyframes slide { from { transform: translateX(0); } to { transform: translateX(880px); } }
    .pulse { animation: pulse 2s ease-in-out infinite; }
    @keyframes pulse { 0%,100% { opacity: 0.55; } 50% { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { .dot, .pulse { animation: none; } }
  </style>
  <rect class="pulse" x="40" y="11" width="920" height="2" rx="1" fill="url(#line)"/>
  <circle class="dot" cx="60" cy="12" r="4" fill="#FFFFFF" filter="url(#g)"/>
</svg>
