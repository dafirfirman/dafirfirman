<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 320" width="1000" height="320" role="img" aria-label="Firman Damai Zebua - Software Developer, Educator, ML Researcher">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050816"/>
      <stop offset="0.55" stop-color="#0B1030"/>
      <stop offset="1" stop-color="#1A0B3B"/>
    </linearGradient>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00F0FF"/>
      <stop offset="0.5" stop-color="#7C5CFF"/>
      <stop offset="1" stop-color="#FF4FD8"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#050816" stop-opacity="0"/>
      <stop offset="1" stop-color="#050816" stop-opacity="0.9"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <!-- One firework burst: two rings of sparks around (0,0) -->
    <g id="spark">
      <circle cx="34" cy="0" r="2.6"/><circle cx="29.4" cy="17" r="2.6"/>
      <circle cx="17" cy="29.4" r="2.6"/><circle cx="0" cy="34" r="2.6"/>
      <circle cx="-17" cy="29.4" r="2.6"/><circle cx="-29.4" cy="17" r="2.6"/>
      <circle cx="-34" cy="0" r="2.6"/><circle cx="-29.4" cy="-17" r="2.6"/>
      <circle cx="-17" cy="-29.4" r="2.6"/><circle cx="0" cy="-34" r="2.6"/>
      <circle cx="17" cy="-29.4" r="2.6"/><circle cx="29.4" cy="-17" r="2.6"/>
      <circle cx="18" cy="0" r="1.8"/><circle cx="12.7" cy="12.7" r="1.8"/>
      <circle cx="0" cy="18" r="1.8"/><circle cx="-12.7" cy="12.7" r="1.8"/>
      <circle cx="-18" cy="0" r="1.8"/><circle cx="-12.7" cy="-12.7" r="1.8"/>
      <circle cx="0" cy="-18" r="1.8"/><circle cx="12.7" cy="-12.7" r="1.8"/>
    </g>
  </defs>

  <style>
    .burst { transform: scale(0.1); opacity: 0; animation: boom 4.2s ease-out infinite; }
    .d1 { animation-delay: 0s; }
    .d2 { animation-delay: 0.9s; }
    .d3 { animation-delay: 1.7s; }
    .d4 { animation-delay: 2.4s; }
    .d5 { animation-delay: 3.1s; }
    .d6 { animation-delay: 3.7s; }
    @keyframes boom {
      0%   { transform: scale(0.1); opacity: 0; }
      8%   { opacity: 1; }
      55%  { transform: scale(1.7); opacity: 1; }
      100% { transform: scale(2.3); opacity: 0; }
    }
    .star { animation: twinkle 2.6s ease-in-out infinite; }
    .s2 { animation-delay: 0.6s; } .s3 { animation-delay: 1.2s; } .s4 { animation-delay: 1.9s; }
    @keyframes twinkle { 0%,100% { opacity: 0.15; } 50% { opacity: 1; } }
    .float { animation: float 5s ease-in-out infinite; }
    @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
    .caret { animation: blink 1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) {
      .burst, .star, .float, .caret { animation: none; }
      .burst { opacity: 0.5; transform: scale(1.2); }
    }
  </style>

  <rect width="1000" height="320" fill="url(#bg)"/>

  <!-- stars -->
  <g fill="#FFFFFF">
    <circle class="star" cx="60" cy="40" r="1.6"/><circle class="star s2" cx="180" cy="95" r="1.2"/>
    <circle class="star s3" cx="310" cy="30" r="1.5"/><circle class="star s4" cx="440" cy="70" r="1.1"/>
    <circle class="star" cx="560" cy="25" r="1.4"/><circle class="star s3" cx="690" cy="60" r="1.2"/>
    <circle class="star s2" cx="820" cy="35" r="1.6"/><circle class="star s4" cx="940" cy="85" r="1.3"/>
    <circle class="star s3" cx="110" cy="250" r="1.2"/><circle class="star" cx="880" cy="240" r="1.3"/>
    <circle class="star s2" cx="500" cy="285" r="1.1"/>
  </g>

  <!-- fireworks -->
  <g filter="url(#glow)">
    <g transform="translate(150 105)" fill="#00F0FF"><g class="burst d1"><use href="#spark"/></g></g>
    <g transform="translate(850 95)" fill="#FF4FD8"><g class="burst d2"><use href="#spark"/></g></g>
    <g transform="translate(330 70)" fill="#FFD166"><g class="burst d3"><use href="#spark"/></g></g>
    <g transform="translate(690 60)" fill="#7C5CFF"><g class="burst d4"><use href="#spark"/></g></g>
    <g transform="translate(90 230)" fill="#FF4FD8"><g class="burst d5"><use href="#spark"/></g></g>
    <g transform="translate(920 235)" fill="#00F0FF"><g class="burst d6"><use href="#spark"/></g></g>
  </g>

  <!-- bottom fade -->
  <rect y="200" width="1000" height="120" fill="url(#fade)"/>

  <!-- text -->
  <g class="float" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
    <text x="500" y="145" font-size="54" font-weight="800" fill="url(#name)" filter="url(#glow)">Firman Damai Zebua</text>
    <text x="500" y="192" font-size="21" fill="#C9D4FF" letter-spacing="2">SOFTWARE DEVELOPER  •  EDUCATOR  •  ML RESEARCHER</text>
    <text x="500" y="232" font-size="15" fill="#7F8CB8" font-family="'Courier New', monospace">$ building things that learn<tspan class="caret" fill="#00F0FF">_</tspan></text>
  </g>
</svg>
