<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 160" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a16" />
      <stop offset="100%" stop-color="#120826" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="160" rx="12" fill="url(#bg)" />

  <!-- Animated Stars / Particles -->
  <g fill="#00F0FF" opacity="0.8">
    <circle cx="100" cy="40" r="1.5">
      <animate attributeName="opacity" values="0.2;1;0.2" dur="2s" repeatCount="indefinite" />
    </circle>
    <circle cx="250" cy="120" r="2">
      <animate attributeName="opacity" values="1;0.2;1" dur="3s" repeatCount="indefinite" />
    </circle>
    <circle cx="650" cy="50" r="1.5">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="2.5s" repeatCount="indefinite" />
    </circle>
    <circle cx="700" cy="130" r="2">
      <animate attributeName="opacity" values="0.8;0.1;0.8" dur="1.8s" repeatCount="indefinite" />
    </circle>
    <circle cx="400" cy="30" r="1">
      <animate attributeName="opacity" values="0.2;0.9;0.2" dur="4s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- Fireworks / Burst 1 (Left) -->
  <g transform="translate(180, 80)" filter="url(#glow)">
    <circle cx="0" cy="0" r="2" fill="#00F0FF">
      <animate attributeName="r" values="0;35;0" dur="2.5s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="1;0;0" dur="2.5s" repeatCount="indefinite" />
    </circle>
    <!-- Sparks -->
    <path d="M0 0 L0 -35 M0 0 L25 -25 M0 0 L35 0 M0 0 L25 25 M0 0 L0 35 M0 0 L-25 25 M0 0 L-35 0 M0 0 L-25 -25" stroke="#00F0FF" stroke-width="1.5" stroke-linecap="round">
      <animate attributeName="transform" type="scale" values="0;1.2" dur="2.5s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="1;0" dur="2.5s" repeatCount="indefinite" />
    </path>
  </g>

  <!-- Fireworks / Burst 2 (Right) -->
  <g transform="translate(620, 75)" filter="url(#glow)">
    <circle cx="0" cy="0" r="2" fill="#BD00FF">
      <animate attributeName="r" values="0;40;0" dur="3s" begin="1s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="1;0;0" dur="3s" begin="1s" repeatCount="indefinite" />
    </circle>
    <path d="M0 0 L0 -40 M0 0 L28 -28 M0 0 L40 0 M0 0 L28 28 M0 0 L0 40 M0 0 L-28 28 M0 0 L-40 0 M0 0 L-28 -28" stroke="#BD00FF" stroke-width="1.5" stroke-linecap="round">
      <animate attributeName="transform" type="scale" values="0;1.3" dur="3s" begin="1s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="1;0" dur="3s" begin="1s" repeatCount="indefinite" />
    </path>
  </g>

  <!-- Central Title Text -->
  <text x="400" y="70" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">
    FIRMAN DAMAI ZEBUA, S.Kom.
  </text>
  
  <text x="400" y="105" font-family="Fira Code, monospace" font-size="14" font-weight="600" fill="#00F0FF" text-anchor="middle" letter-spacing="0.5">
    &lt; Software Developer &amp; AI Researcher /&gt;
  </text>
</svg>
